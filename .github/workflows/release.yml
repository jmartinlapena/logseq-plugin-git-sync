name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare unpacked plugin
        run: |
          mkdir -p artifact
          cp package.json artifact/
          cp logo.png artifact/
          cp LICENSE artifact/
          cp README.md artifact/
          cp -R dist artifact/dist

      - name: Upload unpacked plugin
        uses: actions/upload-artifact@v4
        with:
          name: logseq-plugin-git-sync
          path: artifact/
          if-no-files-found: error
